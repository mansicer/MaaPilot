[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maapilot"
dynamic = ["version"]
description = "明日方舟账号助手：给 Claude Code 用的命令行工具"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "MaaFw==5.13.0",
    "MaaAgentBinary==1.0.1",
    "numpy==2.5.3",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "PyYAML==6.0.3",
    "cryptography==50.0.2",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
maapilot = "maapilot.cli:main"

[tool.hatch.version]
path = "maapilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["maapilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
