# 商店兑换（官服）：养成目标为了补齐材料会自动兑换的商品（D135）。其他服务器各写一份 <服务器>.yaml，没有文件 = 这个服务器不自动兑换。
# 游戏数据表（ArknightsGameData）里没有商店：商品、价格、限购由服务器下发，所以这里的数来自公开资料，每条注明来源与查询日期；
# 游戏更新后价格或限购变了，改这里即可（执行时还会在确认框上核对总价，对不上就不买）。
#
# 每条：
#   item      物品 id（data/item_table.json）
#   shop/tab  采购中心里的位置：凭证交易所 → 分区标签；也是执行时找标签用的文字
#   currency  花的物品 id；price 单价
#   limit     每期限购件数，null = 不限；period 限购周期：month（每月 1 日 04:00 重置）/ null
#   source    数据来源
version: 1
offers:
  - item: "32001"            # 芯片助剂：合成双芯片（制造站）的必备材料，刷不到，只能兑换
    shop: 凭证交易所
    tab: 采购凭证区
    currency: "4006"         # 采购凭证：粉碎防御（AP 本）固定掉落
    price: 90
    limit: null              # 库存 ∞
    period: null
    source: "PRTS「采购中心」凭证交易所·采购凭证区·其它道具：芯片助剂 90 采购凭证，库存 ∞（2026-09-29 查询）"
