# MaaPilot 配置。setup 时复制到 private/config.yaml 并填好；之后用户或 agent 都可以改（改完跑 maapilot doctor 确认）。
# 字段含义见 docs/cli.md「private/config.yaml」。

# 模拟器连接。address 是 adb 地址（host:port，或 `adb devices` 列出的序列号），setup 时找出来填；不要照抄别人的。
emulator:
  address: ""
  adb: adb                # adb 程序；不在 PATH 上就写绝对路径。maa-cli 也会用这个 adb（写进它的 profile），免得两个 adb 抢着连
                          # Windows 路径用单引号（双引号里的 \ 会被当成转义）：adb: 'C:\Program Files\Netease\MuMuPlayer-12.0\shell\adb.exe'

# 游戏客户端（MAA 的 client_type）：Official 官服 / Bilibili B 服 / YoStarEN 国际服 / YoStarJP 日服 / YoStarKR 韩服 / txwy 繁中服
server: Official

# 定时日常叫起的 agent：claude（Claude Code）或 codex（Codex）。用户平时在哪个里面跟助手说话就用哪个。
# 改成 codex 前先 `maapilot host install codex`；改完要重新 `maapilot daily schedule`。
agent: claude

# 定时任务里用到的程序。定时任务的 PATH 很短，setup 时写成绝对路径（macOS / Linux：`command -v maa`；
# Windows：`where.exe maa`，写成单引号的 'C:\...\maa.exe'）。只用到 agent 选的那一个（claude 或 codex）。
tools:
  maa: maa
  claude: claude
  codex: codex

# 游戏客户端更新（maapilot game version / update，目前只支持官服）。
game:
  # 更新后弹出《用户协议》《隐私政策》更新时，agent 能不能直接替你点"同意"：
  #   留空（null）= 还没问过，每次都问你；true = 可以直接点同意；false = 每次都问你
  accept_terms: null

# 每天定时跑日常的时间（本机时间，24 小时制）。改完要重新 `maapilot daily schedule` 才生效。
# 游戏每天 04:00 换日，别把时间点放在 04:00 前后几分钟。
schedule:
  - "04:40"
  - "16:40"

# 定时日常的两个开关（只在 Windows 上起作用，设定时时问用户；改完要重新 `maapilot daily schedule`）。
# macOS / Linux 用 cron：到点时电脑睡着或关着就跳过这一次，不补跑，也不会叫醒电脑。
schedule_options:
  run_if_missed: true     # 到点时电脑关着或睡着：开机 / 醒来后补跑这一次
  wake_computer: false    # 到点时把睡着的电脑叫醒来跑（电源设置里要允许唤醒定时器）

daily:
  # 按顺序跑的 MAA 日常项（去掉不想做的即可）：
  #   startup 启动游戏回首页 | recruit 公开招募 | infrast 基建换班收菜 | mall 信用商店与访问好友
  #   annihilation 剿灭（每次日常打 1 次；本周合成玉拿满后就跳过） | award 领任务奖励与邮件
  # 刷理智不在这里：有进行中的目标时 agent 刷目标缺的材料，没有就刷下面的 default_stage。award 总在刷理智之后。
  tasks: [startup, recruit, infrast, mall, annihilation, award]
  # 没有进行中的目标时，剩余理智刷哪关
  default_stage: "1-7"
  # 给某个日常项改 MAA 参数（可选，参数名见 MAA 文档的任务参数，写错会报错）。例如：
  # params:
  #   recruit: { times: 4, refresh: true }
  #   mall: { buy_first: ["招聘许可"], blacklist: ["家具零件"] }
  params: {}
  # 定时日常里叫起来的 agent 最长跑多久：做目标部分的、接管失败项的；一个 MAA 日常项最长跑多久（分钟）
  agent_timeout_min: 90
  recovery_timeout_min: 30
  task_timeout_min: 90
  # 刷理智（没有目标时刷 default_stage）的时限按理智算：能打几次 = 理智 ÷ 一次的理智（向上取整），
  # 时限 = 次数 × farm_min_per_fight + farm_timeout_margin_min（分钟）。读不到理智时用上面的 task_timeout_min。
  farm_min_per_fight: 3
  farm_timeout_margin_min: 15
  # 每个游戏日（04:00 换日）重读一次干员练度（MAA 干员识别 → private/state/box.json），在刷理智之前；最长几分钟
  read_box: true
  box_timeout_min: 15
